<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craft Media Hub Desktop Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #080d1a;
      color: #f8fafc;
      padding: 16px;
      user-select: none;
      -webkit-app-region: drag;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(245, 158, 11, 0.2);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, #ea580c, #dc2626);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .brand-title {
      font-weight: 800;
      font-size: 13px;
      color: #fff;
    }
    .brand-sub {
      font-size: 10px;
      color: #fbbf24;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
    .status-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .status-val {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px;
    }
    .metric-num {
      font-size: 16px;
      font-weight: 800;
      font-family: ui-monospace, monospace;
      margin-top: 2px;
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #64748b;
      border-top: 1px solid #1e293b;
      padding-top: 8px;
    }
    .badge-tag {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 9px;
    }
  </style>
</head>
<body>
  <div>
    <div class="header">
      <div class="brand">
        <div class="logo-badge">CM</div>
        <div>
          <div class="brand-title">Craft Media Hub Tracker</div>
          <div class="brand-sub">Enterprise Active Telemetry</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="pulse-dot"></div>
        <span style="font-size:11px;font-weight:700;color:#10b981;">ACTIVE</span>
      </div>
    </div>

    <div class="status-card">
      <div class="status-label">Current Active Window</div>
      <div class="status-val" id="activeWindowText">Google Chrome - Craft Media Hub CRM</div>
    </div>

    <div class="metrics-grid">
      <div class="metric-box">
        <div class="status-label">Shift Duration</div>
        <div class="metric-num" style="color:#60a5fa;" id="shiftTimeText">04:15:20</div>
      </div>
      <div class="metric-box">
        <div class="status-label">Active Screen Time</div>
        <div class="metric-num" style="color:#34d399;" id="screenTimeText">03:52:10</div>
      </div>
      <div class="metric-box">
        <div class="status-label">Idle Inactivity</div>
        <div class="metric-num" style="color:#fbbf24;" id="idleTimeText">00:08:10</div>
      </div>
      <div class="metric-box">
        <div class="status-label">Sync Status</div>
        <div class="metric-num" style="color:#a78bfa;font-size:13px;padding-top:4px;" id="syncStatusText">🟢 Connected</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="badge-privacy">🔒 Zero-Surveillance Compliance</span>
    <span>v1.0.0 Enterprise</span>
  </div>
</body>
</html>
