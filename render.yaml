services:
  - type: web
    name: 360crm-api
    runtime: node
    rootDir: craftmedia_backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: 360crm-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://craftnova-backend-v2n3.onrender.com/api
      - key: VITE_APP_URL
        value: https://craftnova-crm.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
